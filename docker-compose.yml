services:
  redis:
    image: redis:7-alpine
    container_name: atomicq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  worker:
    build: .
    image: atomicq:latest
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DISABLE_API=true
      - DISABLE_SCHEDULER=true
      - DISABLE_WORKERS=false
    deploy:
      replicas: 3
    # Longer than the engine's 30s drain timeout, so `docker stop` and scale-downs
    # let running jobs finish instead of killing them after Docker's default 10s
    stop_grace_period: 35s
    restart: always

  dashboard:
    build: .
    image: atomicq:latest
    depends_on:
      - redis
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DISABLE_API=false
      - DISABLE_SCHEDULER=false
      - DISABLE_WORKERS=true
    restart: always

volumes:
  redis_data:
